services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://croquis:croquis@db:5432/croquis
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      # internal compose-network address; .env's localhost:9002 is for running the app outside docker
      - MINIO_ENDPOINT=storage
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-croquis}
      - MINIO_PUBLIC_ENDPOINT=localhost
      - MINIO_PUBLIC_PORT=9002
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET:-magic-link-dev-secret}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    command: >
      sh -c "npx prisma generate && npx prisma db push && npm run dev"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=croquis
      - POSTGRES_PASSWORD=croquis
      - POSTGRES_DB=croquis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U croquis"]
      interval: 3s
      timeout: 3s
      retries: 10

  storage:
    image: minio/minio:latest
    ports:
      - "9002:9000"  # host 9000 is occupied on Windows; container still listens on 9000
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
